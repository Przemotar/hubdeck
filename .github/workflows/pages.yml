# The project page (site/) on GitHub Pages: przemotar.github.io/hubdeck. Public repository only.
# Every day it also builds the Plugins tab's catalog (site/plugins.json, scripts/plugins/catalog.mjs):
# stars, systems and new plugins change without a release.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/plugins/**", "app/src-tauri/src/engine/sdcatalog.json", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Przemotar/hubdeck'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # a failed build leaves the file out: the app then joins the OpenAction and Elgato lists itself
      - name: Plugin catalog
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/plugins/catalog.mjs site/plugins.json
      # the sitemap tells search engines when the page last changed: the date of this commit
      - name: Sitemap date
        run: sed -i "s|<lastmod>.*</lastmod>|<lastmod>$(git log -1 --format=%cs)</lastmod>|" site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
