# A tag like v0.2.0 builds the Windows and macOS installers, signs the update files and drafts a
# GitHub release with latest.json for the in-app updater. The release stays a draft until the
# maintainer publishes it. Public repository only.
#
# Before tagging, CHANGELOG.md needs a "## <version>" section: it becomes the release notes.
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the updater key made
# with `pnpm tauri signer generate`; its public half is in tauri.conf.json); MACOS_CERTIFICATE (base64
# .p12) and MACOS_CERTIFICATE_PASSWORD (the self-signed "HubDeck Release" code-signing certificate).
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: github.repository == 'Przemotar/hubdeck'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # macOS: sign with the project's own certificate (self-signed, the same for every version), so
      # macOS keeps the user's Accessibility and Automation permissions across updates; an ad-hoc
      # signature changes with every build and loses them. Not notarised: the first open still asks.
      - if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/build.keychain-db"; kp="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -t 3600 -u "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$kc" | grep -q '"HubDeck Release"'
      # the release notes (shown on the release page and as "What's new" in the app) are this
      # version's section of CHANGELOG.md
      - id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"   # a test tag like v0.1.0-rc.1 uses the 0.1.0 section
          awk -v v="$version" '/^## /{f = index($0, "## " v " ") == 1 || $0 == "## " v; next} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version" >&2; exit 1; fi
          { echo 'body<<NOTES_END'; cat notes.md; echo 'NOTES_END'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # lay out the .dmg window (background, icon places) on CI too; Tauri skips it there by default
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: HubDeck ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          # update files (.sig, latest.json) only here: local builds have no private key
          args: ${{ matrix.args }} --config ${{ github.workspace }}/app/src-tauri/tauri.release.conf.json
      # a file name without the version, so "latest" links (the site's and README's download
      # buttons) always reach the newest installer; and each file's SHA-256 next to it
      - name: Stable names and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            src=$(find target -path '*bundle/nsis/*-setup.exe' | head -1); dst=HubDeck-windows-x64-setup.exe; sums=SHA256-windows.txt
          else
            src=$(find target -path '*bundle/dmg/*.dmg' | head -1); dst=HubDeck-macos.dmg; sums=SHA256-macos.txt
          fi
          test -n "$src"
          cp "$src" "$dst"
          { sha256sum "$dst" "$src" 2>/dev/null || shasum -a 256 "$dst" "$src"; } | sed 's#  .*/#  #' > "$sums"
          gh release upload "$GITHUB_REF_NAME" "$dst" "$sums" --clobber
      # which file to pick and what the first start asks, under the notes on the release page (added
      # once, after the update files were made, so the app's "What's new" stays the changelog only)
      - name: Install help on the release page
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body -q .body > body.md
          grep -q '^### Which file' body.md && exit 0
          cat >> body.md <<'HELP'

          ### Which file
          - **Windows 10 or 11**: `HubDeck-windows-x64-setup.exe` (the `.msi` is for managed installs). Windows SmartScreen may ask once: *More info > Run anyway* (the app is not signed with a paid certificate).
          - **macOS 12 or later** (Apple silicon and Intel): `HubDeck-macos.dmg`. The first time, macOS says it could not verify HubDeck: *Done*, then System Settings > Privacy & Security > *Open Anyway*.
          - Checksums: `SHA256-windows.txt` and `SHA256-macos.txt`. More help: the [README](https://github.com/Przemotar/hubdeck#install).
          HELP
          sed -i '' 's/^          //' body.md 2>/dev/null || sed -i 's/^          //' body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file body.md
