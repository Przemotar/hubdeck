# A tag like v0.2.0 builds the Windows and macOS installers, signs the update files and drafts a
# GitHub release with latest.json for the in-app updater. The release stays a draft until the
# maintainer publishes it. Public repository only.
#
# Before tagging, CHANGELOG.md needs a "## <version>" section: it becomes the release notes.
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the updater key made
# with `pnpm tauri signer generate`; its public half is in tauri.conf.json).
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: github.repository == 'Przemotar/hubdeck'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # the release notes (shown on the release page and as "What's new" in the app) are this
      # version's section of CHANGELOG.md
      - id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"   # a test tag like v0.1.0-rc.1 uses the 0.1.0 section
          awk -v v="$version" '/^## /{f = index($0, "## " v " ") == 1 || $0 == "## " v; next} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version" >&2; exit 1; fi
          { echo 'body<<NOTES_END'; cat notes.md; echo 'NOTES_END'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: HubDeck ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          # update files (.sig, latest.json) only here: local builds have no private key
          args: ${{ matrix.args }} --config ${{ github.workspace }}/app/src-tauri/tauri.release.conf.json
