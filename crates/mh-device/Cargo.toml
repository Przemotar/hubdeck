[package]
name = "mh-device"
description = "USB HID transport and hot-plug hub for the Cooler Master MasterHUB modules"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mh-protocol.workspace = true
hidapi.workspace = true
log.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The modules are vendor-defined HID (usage page 0xFF00) and get no hidraw node on Linux; the
# libusb backend opens /dev/bus/usb nodes instead (a udev rule has to allow the vendor id).
hidapi = { workspace = true, features = ["linux-static-libusb"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[build-dependencies]
cc = "1"

[dev-dependencies]
image.workspace = true
env_logger.workspace = true

# examples/pipeline.rs: overlapped writes on a handle of its own
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
